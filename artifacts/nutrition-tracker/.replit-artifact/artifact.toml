kind = "web"
previewPath = "/"
title = "NutriTrack — Nutrition & Gym Tracker"
version = "1.0.0"
id = "artifacts/nutrition-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20144

[services.development]
run = "pnpm --filter @workspace/nutrition-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nutrition-tracker", "run", "build" ]
publicDir = "artifacts/nutrition-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20144"
BASE_PATH = "/"
